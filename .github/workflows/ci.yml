name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (pytest, with coverage)
        run: pytest --cov=gradus --cov-report=term-missing

  # GPU-dependent tests (Phase 4+) run only where a CUDA runner is
  # available and are intentionally not part of this default CI job;
  # they are exercised locally / on a GPU-enabled runner and reported
  # in the benchmark report rather than gated on here.
